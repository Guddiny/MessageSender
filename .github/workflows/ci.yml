name: Continuous Integration
on:
  push:
    tags:
      - '**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win-x64
          - os: macos-latest
            platform: osx-x64
          - os: macos-latest
            platform: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Publish
        run: dotnet publish MessageSender.Desktop/MessageSender.Desktop.csproj -c Release -r ${{ matrix.platform }} --self-contained -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=1.2.3

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MessageSender-${{ matrix.platform }}-123
          path: MessageSender.Desktop/bin/Release/net10.0/${{ matrix.platform }}/publish

  release:
    needs: [build]
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: '2.0.9'
          VERSION: 1.2.3
        run: gh release create "$TAG" -t "$VERSION" --notes-from-tag
